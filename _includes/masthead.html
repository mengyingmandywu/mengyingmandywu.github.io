{% include base_path %}
<header class="mast">
  <div class="wrap">
    <a class="name" href="{{ base_path }}/">{{ site.title }}</a>
    <nav aria-label="Main">
      {% for link in site.data.navigation.main %}
        <a href="{{ base_path }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
